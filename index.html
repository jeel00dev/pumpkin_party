<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pumpkin Party</title>
  <meta name="description" content="A Halloween knockout platformer: race, dodge and survive against AI rivals for the Golden Treat.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2c1590">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='18' rx='14' ry='11' fill='%23ff8716'/%3E%3Crect x='14' y='3' width='4' height='6' rx='1.500' fill='%234f8f2a'/%3E%3C/svg%3E">
  <!-- CrazyGames SDK v3. Async, and the game runs without it when offline or blocked. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async onerror="window.__sdkFailed=true"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #2c1590; overflow: hidden; }
    #boot { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: #2c1590 url(art/loading.webp) center / cover no-repeat; color: #fff; font: 800 22px system-ui, sans-serif; transition: opacity .35s; }
    #boot .bar { width: min(600px, 72%); height: 22px; border-radius: 16px; background: rgba(24, 10, 80, .86); margin-bottom: 7%; padding: 3px; box-sizing: border-box; }
    #boot .bar i { display: block; height: 100%; width: 3%; border-radius: inherit; background: linear-gradient(180deg, #ffe25a, #fbb214); transition: width .2s; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #boot .logo { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); height: 58%; max-width: 88%; object-fit: contain; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Pumpkin Party game"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <img class="logo" src="art/logo.webp" alt="Pumpkin Party" draggable="false">
    <div class="lab">Loading... 0%</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="rotate can">Please rotate your device to play</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
